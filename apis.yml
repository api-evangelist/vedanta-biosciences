aid: vedanta-biosciences
name: Vedanta Biosciences
description: 'Vedanta Biosciences is a late clinical-stage biopharmaceutical company
  headquartered at 19 Blackstone Street in Cambridge, Massachusetts, founded by PureTech
  Health together with a group of scientific co-founders who pioneered the modern understanding
  of cross-talk between the human microbiome and the immune system. The company develops
  a potential new category of oral Live Biotherapeutic Products built from rationally
  defined consortia of human commensal bacteria grown from pure clonal cell banks rather
  than donor-derived stool, and it maintains technical expertise in the manufacture of
  live organisms. Its lead program, VE303, is an eight-strain defined bacterial consortium
  in the global Phase 3 RESTORATiVE303 registrational study for the prevention of recurrent
  Clostridioides difficile infection, following Phase 2 results showing a greater than
  80% reduction in the odds of CDI recurrence versus placebo; VE202 is in development
  for inflammatory bowel disease and VE707 for prevention of multidrug-resistant organism
  infections. Vedanta has raised a $68 million Series D and a $106.5 million financing,
  and its programs are supported by non-dilutive awards from BARDA and CARB-X. Vedanta
  is a therapeutics developer, not a software vendor: it runs a WordPress marketing and
  corporate site, publishes no developer portal, no SDKs, no GitHub organization and no
  machine-readable API contract, and an August 2026 probe of vedantabio.com found no
  OpenAPI, no /llms.txt, no MCP endpoint, no A2A agent card and an empty /.well-known/
  discovery surface.'
