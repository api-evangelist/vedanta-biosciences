source: >-
  vedantabio.com (mission, pipeline, partnerships, expanded-access pages), PureTech Health
  and BARDA/CARB-X announcements, and the live probes recorded in
  well-known/vedanta-biosciences-well-known.yml (2026-08-02)
scope: >-
  Vedanta Biosciences publishes no API, so there are no API or cross-cutting technical
  standards to assert. What the company is actually measured against is the US and
  international drug-development regulatory pathway for a Live Biotherapeutic Product.
  That pathway is recorded here as the applicable regime, with status stated honestly as
  in-progress rather than achieved. The API/protocol standards block below is recorded as
  applicable:false rather than a bare false, so this file is never mistaken for a
  compliance posture the company does not claim.
regulatory_regime:
- id: fda-ind-bla-live-biotherapeutic-product
  name: >-
    US FDA CBER pathway for Live Biotherapeutic Products (IND -> registrational trial ->
    Biologics License Application)
  conforms: false
  status: in-progress
  evidence: >-
    VE303 is in the global Phase 3 RESTORATiVE303 registrational study for prevention of
    recurrent Clostridioides difficile infection, following a Phase 2 study reported as
    showing a greater than 80% reduction in the odds of CDI recurrence versus placebo. No
    FDA licensure/approval for any Vedanta product has been announced.
  note: >-
    Recorded as conforms:false because licensure has not been granted, not because a check
    was failed. Re-probe on the next pass.
- id: clinicaltrials-gov-registration
  name: US FDAAA 801 / ICMJE public clinical-trial registration
  conforms: true
  evidence: >-
    Vedanta publicly identifies and describes its registrational study by name
    (RESTORATiVE303) and maintains a patient-facing trial page at
    https://www.vedantabio.com/commitment-to-patients/restorative303/
- id: expanded-access-policy-21st-century-cures
  name: >-
    US 21st Century Cures Act section 3032 public expanded-access (compassionate use)
    policy requirement for investigational drugs
  conforms: true
  evidence: >-
    A public expanded access policy is published at
    https://www.vedantabio.com/commitment-to-patients/expanded-access-policy/
- id: cgmp-live-organism-manufacturing
  name: cGMP manufacture of live biotherapeutic drug product from clonal cell banks
  conforms: true
  status: claimed
  evidence: >-
    The company describes in-house technical expertise in the manufacture of live
    organisms and production from pure clonal cell banks
    (https://www.vedantabio.com/our-science/manufacturing/). This is a company claim, not
    an independently verified certificate.
- id: barda-carbx-funded-development
  name: US BARDA and CARB-X non-dilutive development awards
  conforms: true
  evidence: >-
    https://www.vedantabio.com/who-we-are/partnerships/ documents BARDA reimbursement of
    up to $114.2M for VE303 subject to milestones, and CARB-X research grants supporting
    VE303 and VE707.
